name: release-build

# OpenPrintShare 多平台自动构建：推送 v* tag 或手动触发
# 产物：Windows exe/msi/zip · macOS dmg/app · Linux AppImage/deb/二进制 · Android apk · iOS（有证书时 ipa）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------- Linux（x64 + arm64）
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web + embedded host
        run: |
          bun install --frozen-lockfile
          OPS_EXPORT=1 bunx next build
          (cd mini-services/ops-host && bun install --frozen-lockfile && bun ../../scripts/build-web-embed.ts ../../out)

      - name: "Package Linux (x64: binary + .deb + AppImage; arm64: binary + .deb)"
        run: |
          bash scripts/build-linux.sh x64
          # arm64 附加产物（AppImage 工具链对 arm64 CI 环境按需跳过）
          bash scripts/build-host.sh linux-arm64
          VERSION=$(grep -oP "OPS_VERSION = '\K[^']+" mini-services/ops-host/src/core/types.ts | head -1)
          DEBROOT=dist/.stage/deb-arm64
          mkdir -p "$DEBROOT/opt/openprintshare" "$DEBROOT/usr/bin" "$DEBROOT/usr/share/applications" "$DEBROOT/DEBIAN"
          cp dist/linux/OpenPrintShare-Linux-arm64-$VERSION "$DEBROOT/opt/openprintshare/openprintshare"
          chmod 755 "$DEBROOT/opt/openprintshare/openprintshare"
          ln -s /opt/openprintshare/openprintshare "$DEBROOT/usr/bin/openprintshare"
          printf 'Package: openprintshare\nVersion: %s\nSection: net\nPriority: optional\nArchitecture: arm64\nMaintainer: OpenPrintShare <wanan-love@users.noreply.github.com>\nDescription: OpenPrintShare Host (arm64)\nHomepage: https://github.com/wanan-love/ops\n' "$VERSION" > "$DEBROOT/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$DEBROOT" "dist/linux/OpenPrintShare-Linux-arm64-$VERSION.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/linux/*
            !dist/linux/.stage

  # ------------------------------------------------------------- Windows（exe + 便携 zip + MSI）
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web + embedded host
        shell: bash
        run: |
          bun install --frozen-lockfile
          OPS_EXPORT=1 bunx next build
          (cd mini-services/ops-host && bun install --frozen-lockfile && bun ../../scripts/build-web-embed.ts ../../out)

      - name: Compile exe + portable zip
        shell: bash
        run: bash scripts/build-windows.sh

      - name: "Build MSI installer (WiX v6)"
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "6.*"
          $version = (Select-String -Path mini-services/ops-host/src/core/types.ts -Pattern "OPS_VERSION = '([^']+)'").Matches[0].Groups[1].Value
          wix build -arch x64 packaging/windows/openprintshare.wxs `
            -d "Version=$version" `
            -d "ExePath=dist/windows/OpenPrintShare-Windows-x64-$version.exe" `
            -o "dist/windows/OpenPrintShare-Windows-x64-$version.msi"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/windows/*

  # ------------------------------------------------------------- macOS（.app + .dmg，原生宿主构建）
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web + embedded host
        run: |
          bun install --frozen-lockfile
          OPS_EXPORT=1 bunx next build
          (cd mini-services/ops-host && bun install --frozen-lockfile && bun ../../scripts/build-web-embed.ts ../../out)
          # macOS runner 磁盘紧张（~14GB）：静态导出后 .next 与主项目 node_modules
          # 不再参与 host 编译（host 用自己的 node_modules + out/ 嵌入清单），及时回收
          rm -rf .next node_modules

      - name: Build .app + .dmg (arm64 + x64)
        run: bash scripts/build-macos.sh --dmg

      # .app 是目录树——打单 zip 上传（Release flatten 平铺修复，同 iOS xcarchive 策略）
      - name: Package .app as single zip
        run: |
          cd dist/macos
          find . -maxdepth 1 -name "*.app" -exec sh -c 'zip -ryq "$1.zip" "$1" && rm -rf "$1"' _ {} \;
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/macos/*

  # ------------------------------------------------------------- Android（APK）
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # 仓库自带 gradle-8.7 wrapper（gradlew + jar）：不依赖 runner 全局 gradle（ubuntu 镜像未预装）
      # 版本单一来源：types.ts OPS_VERSION → -PopsVersion / -PopsVersionCode（major*10000+minor*100+patch）
      # 产物策略：assembleDebug（debug-signed universal，可直接安装；正式签名后续 secrets 升级）
      - name: Build APK (debug-signed universal, version from Host)
        working-directory: clients/android
        run: |
          VERSION=$(grep -oP "OPS_VERSION = '\K[^']+" ../../mini-services/ops-host/src/core/types.ts | head -1)
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d", $1*10000+$2*100+$3}')
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -PopsVersion="$VERSION" -PopsVersionCode="$CODE"

      - name: Collect APK
        shell: bash
        run: |
          VERSION=$(grep -oP "OPS_VERSION = '\K[^']+" mini-services/ops-host/src/core/types.ts | head -1)
          mkdir -p dist/android
          cp clients/android/app/build/outputs/apk/debug/app-debug.apk "dist/android/OpenPrintShare-Android-universal-$VERSION.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/android/*

  # ------------------------------------------------------------- iOS（无签名证书时产出 xcarchive.zip 供开发者侧打包）
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archive iOS app
        working-directory: clients/ios
        run: |
          xcodebuild -project OpenPrintShare.xcodeproj -scheme OpenPrintShare \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            archive -archivePath ../../dist/ios/OpenPrintShare.xcarchive CODE_SIGNING_ALLOWED=NO

      # xcarchive 是目录树（数百文件）——打成单个 zip 再上传，避免 release flatten 平铺污染附件列表
      - name: Package xcarchive as single zip
        run: |
          VERSION=$(sed -n "s/.*OPS_VERSION = '\([^']*\)'.*/\1/p" mini-services/ops-host/src/core/types.ts | head -1)
          cd dist/ios
          zip -ryq "OpenPrintShare-iOS-$VERSION.xcarchive.zip" OpenPrintShare.xcarchive
          rm -rf OpenPrintShare.xcarchive
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist/ios/*

  # ------------------------------------------------------------- 汇总发布 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist-artifacts -type f ! -name "*.yml" -exec cp {} release/ \;
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
